<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área administrativa — Nossa História</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF3EA; --paper:#FFFBF5; --blush:#F4C9C2; --rose-deep:#A94636;
  --cocoa-deep:#4A3226; --ink-soft:#8A6F60;
  --font-display:'Fraunces', Georgia, serif; --font-body:'Quicksand', sans-serif;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--cream); font-family:var(--font-body); color:var(--cocoa-deep);}
header{padding:26px 20px 10px; text-align:center;}
header h1{font-family:var(--font-display); font-style:italic; font-weight:500; color:var(--rose-deep); margin:0 0 4px;}
header p{color:var(--ink-soft); margin:0; font-size:0.9rem;}
main{max-width:640px; margin:0 auto; padding:20px;}
.cartao{background:var(--paper); border-radius:14px; padding:24px; box-shadow:0 10px 26px rgba(74,50,38,0.12); margin-bottom:26px;}
.cartao h2{font-family:var(--font-display); font-size:1.2rem; margin:0 0 14px; color:var(--cocoa-deep);}
label{display:block; font-size:0.82rem; font-weight:700; color:var(--ink-soft); margin:14px 0 6px;}
input[type=text], input[type=password], input[type=date], textarea{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(107,74,58,0.2);
  font-family:inherit; font-size:0.95rem; background:#fff;
}
textarea{resize:vertical; min-height:64px;}
input[type=file]{margin-top:4px;}
.botao{
  margin-top:18px; background:var(--rose-deep); color:#fff; border:none; padding:11px 22px;
  border-radius:999px; font-weight:700; font-size:0.95rem;
}
.botao:disabled{opacity:0.6;}
.botao-secundario{background:transparent; color:var(--rose-deep); border:1px solid var(--rose-deep);}
.mensagem{margin-top:12px; font-size:0.88rem;}
.mensagem.erro{color:#B4453A;}
.mensagem.sucesso{color:#4E7A44;}
.lista-memorias{display:flex; flex-direction:column; gap:10px;}
.item-memoria{
  display:flex; gap:12px; align-items:center; background:#fff; border-radius:10px; padding:10px;
  box-shadow:0 4px 12px rgba(74,50,38,0.08);
}
.item-memoria img{width:56px; height:56px; object-fit:cover; border-radius:8px; flex-shrink:0;}
.item-memoria .info{flex:1; min-width:0;}
.item-memoria .info strong{display:block; font-size:0.92rem;}
.item-memoria .info span{display:block; font-size:0.78rem; color:var(--ink-soft);}
.item-memoria button{
  background:none; border:none; color:#B4453A; font-size:0.8rem; font-weight:700; flex-shrink:0;
}
a.voltar{display:inline-block; margin-top:6px; color:var(--ink-soft); font-size:0.85rem; text-decoration:none;}
</style>
</head>
<body>
<header>
  <h1>Área administrativa</h1>
  <p>Só para vocês dois — adicione ou remova memórias do álbum.</p>
</header>
<main>

  <div class="cartao">
    <h2>Adicionar uma nova memória</h2>
    <form id="form-nova-memoria">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required>

      <label for="foto">Foto</label>
      <input type="file" id="foto" name="foto" accept="image/*" required>

      <label for="titulo">Título</label>
      <input type="text" id="titulo" name="titulo" placeholder="Ex: Nosso primeiro passeio" required>

      <label for="data">Data</label>
      <input type="text" id="data" name="data" placeholder="Ex: 15/10/2024">

      <label for="local">Local</label>
      <input type="text" id="local" name="local" placeholder="Ex: praia de...">

      <label for="frase">Descrição / frase</label>
      <textarea id="frase" name="frase" placeholder="Uma frase sobre esse momento"></textarea>

      <label for="tags">Tags (separadas por vírgula)</label>
      <input type="text" id="tags" name="tags" placeholder="Ex: viagem, 2025">

      <button type="submit" class="botao" id="botao-enviar">Salvar memória</button>
      <div class="mensagem" id="mensagem-form"></div>
    </form>
  </div>

  <div class="cartao">
    <h2>Memórias salvas</h2>
    <label for="senha-lista">Senha (para poder remover)</label>
    <input type="password" id="senha-lista" placeholder="digite para habilitar remoção">
    <div class="lista-memorias" id="lista-memorias" style="margin-top:14px;"></div>
  </div>

  <a class="voltar" href="index.html">← voltar para o site</a>
</main>

<script>
async function carregarMemorias(){
  const resposta = await fetch('/api/photos', {cache:'no-store'});
  const memorias = await resposta.json();
  const lista = document.getElementById('lista-memorias');
  if(memorias.length === 0){
    lista.innerHTML = '<p style="color:#8A6F60; font-size:0.88rem;">Nenhuma memória salva ainda.</p>';
    return;
  }
  lista.innerHTML = memorias.map(m => `
    <div class="item-memoria">
      <img src="${m.img}" alt="${m.titulo}">
      <div class="info">
        <strong>${m.titulo}</strong>
        <span>${m.data || ''}${m.local ? ' · ' + m.local : ''}</span>
      </div>
      <button data-id="${m.id}">remover</button>
    </div>
  `).join('');

  lista.querySelectorAll('button[data-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const senha = document.getElementById('senha-lista').value;
      if(!senha){ alert('Digite a senha para poder remover.'); return; }
      if(!confirm('Remover esta memória? Essa ação não pode ser desfeita.')) return;
      const resp = await fetch(`/api/photos?id=${btn.dataset.id}&senha=${encodeURIComponent(senha)}`, {method:'DELETE'});
      const dados = await resp.json();
      if(!resp.ok){ alert(dados.erro || 'Não foi possível remover.'); return; }
      carregarMemorias();
    });
  });
}
carregarMemorias();

document.getElementById('form-nova-memoria').addEventListener('submit', async (e) => {
  e.preventDefault();
  const botao = document.getElementById('botao-enviar');
  const mensagem = document.getElementById('mensagem-form');
  botao.disabled = true;
  mensagem.textContent = 'Enviando...';
  mensagem.className = 'mensagem';

  const formData = new FormData(e.target);
  try {
    const resposta = await fetch('/api/photos', { method: 'POST', body: formData });
    const dados = await resposta.json();
    if(!resposta.ok){
      mensagem.textContent = dados.erro || 'Não foi possível salvar.';
      mensagem.className = 'mensagem erro';
    } else {
      mensagem.textContent = 'Memória salva com sucesso! ❤️';
      mensagem.className = 'mensagem sucesso';
      e.target.reset();
      carregarMemorias();
    }
  } catch(erro){
    mensagem.textContent = 'Erro de conexão. Tente novamente.';
    mensagem.className = 'mensagem erro';
  } finally {
    botao.disabled = false;
  }
});
</script>
</body>
</html>
